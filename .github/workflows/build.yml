name: SFOS tissot build

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 2 * * 0"

env:
  DEVICE: tissot
  VENDOR: xiaomi
  PORT_ARCH: armv7hl
  SFOS_VERSION: "4.6.0.11"
  PLATFORM_SDK_ROOT: /srv/hadk/sdk
  ANDROID_ROOT: /srv/hadk/hadk

jobs:
  sync_source:
    runs-on: [self-hosted, sfos-hadk]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure source tree and SDK directories exist
        run: |
          sudo mkdir -p "$ANDROID_ROOT" "$PLATFORM_SDK_ROOT"
          sudo chown -R "$USER:$USER" "$ANDROID_ROOT" "$PLATFORM_SDK_ROOT" 2>/dev/null || true
      - name: Verify Platform SDK / HABUILD chroot present
        run: bash scripts/setup-habuild.sh
      - name: Sync source (incremental, preserves existing source)
        run: bash scripts/sync-source.sh
      - name: Show manifest reference
        run: |
          if [ -f "$ANDROID_ROOT/.repo/manifest.xml" ]; then
            echo "Current manifest:"
            head -5 "$ANDROID_ROOT/.repo/manifest.xml"
          fi

  build_hybris_hal:
    needs: sync_source
    runs-on: [self-hosted, sfos-hadk]
    steps:
      - uses: actions/checkout@v4
      - name: Build hybris-boot / hybris-recovery
        run: bash scripts/build-hybris-hal.sh
      - name: Copy images to workspace for artifact upload
        run: |
          mkdir -p artifacts
          cp "$ANDROID_ROOT/out/target/product/$DEVICE/hybris-boot.img" artifacts/ || echo "hybris-boot.img not found"
          cp "$ANDROID_ROOT/out/target/product/$DEVICE/hybris-recovery.img" artifacts/ || echo "hybris-recovery.img not found"
      - uses: actions/upload-artifact@v4
        with:
          name: hybris-boot-images
          path: artifacts/*
          retention-days: 7

  build_rootfs:
    needs: build_hybris_hal
    runs-on: [self-hosted, sfos-hadk]
    steps:
      - uses: actions/checkout@v4
      - name: Build droid-hal / droid-config RPMs
        run: bash scripts/build-droid-hal.sh
      - uses: actions/upload-artifact@v4
        with:
          name: droid-hal-rpms
          path: artifacts/rpms/*.rpm
          retention-days: 7

  package_image:
    needs: build_rootfs
    runs-on: [self-hosted, sfos-hadk]
    steps:
      - uses: actions/checkout@v4
      - name: Build flashable image with mic
        run: bash scripts/build-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: sfos-tissot-image
          path: artifacts/images/*
          retention-days: 14

name: Build SailfishOS for tissot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  SHARED_DIR: /home/user/actions-shared
  ANDROID_ROOT: /home/user/hadk

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: sfos-tissot-build

      - name: Ensure shared directory exists
        run: mkdir -p "$SHARED_DIR"

      - name: Run build inside SDK container
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v $ANDROID_ROOT:/home/user/hadk \
            -v $SHARED_DIR:/shared \
            -w /workspace/sfos-tissot-build \
            coderus/sailfishos-platform-sdk-base:4.6.0.13 \
            bash -c "
              source tissot.env
              bash run-mic.sh
            "

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: sfe-tissot
          path: /home/user/actions-shared/sfe-*/*.zip

name: Build SailfishOS for tissot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    container:
      image: coderus/sailfishos-platform-sdk-base:4.6.0.13
      volumes:
        - /home/user/hadk:/home/user/hadk   # mount your existing Android source
        - /home/user/actions-shared:/shared  # output directory
    steps:
      - uses: actions/checkout@v4
        with:
          path: sfos-tissot-build

      - name: Set up device config
        run: source sfos-tissot-build/tissot.env

      - name: Run build
        run: bash sfos-tissot-build/run-mic.sh

      - name: Archive flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: sfe-tissot
          path: /shared/sfe-*/*.zip
